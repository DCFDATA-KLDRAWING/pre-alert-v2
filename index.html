<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>船務 PRE-ALERT 郵件套用器 (雲端群組與表格版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        textarea { resize: vertical; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <header class="bg-blue-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                PRE-ALERT 郵件智能套用器
            </h1>
            <div class="flex items-center gap-4">
                <div id="cloudStatus" class="flex items-center gap-1.5 text-xs font-medium text-blue-200 bg-blue-900/50 px-3 py-1.5 rounded-full">
                    <svg class="animate-spin h-3.5 w-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>連線中...</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-5 flex flex-col gap-4">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
                <div class="mb-5">
                    <div class="flex justify-between items-center mb-2">
                        <label for="templateSelect" class="block text-sm font-semibold text-gray-700">選擇郵件模版</label>
                        <div class="flex items-center gap-2">
                            <button onclick="openWorkspaceModal()" id="workspaceBtn" class="flex items-center gap-1.5 text-xs font-medium text-purple-700 bg-purple-100 hover:bg-purple-200 border border-purple-200 px-3 py-1.5 rounded-md transition-colors cursor-pointer shadow-sm">
                                <span id="workspaceText">個人專屬</span>
                            </button>
                            <button onclick="openTemplateManager()" class="text-blue-600 bg-blue-50 hover:bg-blue-100 border border-blue-100 transition-colors px-3 py-1.5 rounded-md text-sm font-medium flex items-center gap-1.5">
                                管理模版
                            </button>
                        </div>
                    </div>
                    <select id="templateSelect" onchange="handleTemplateChange()" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-blue-500 focus:ring-blue-500 bg-gray-50 border p-2.5 text-sm">
                        <option>載入中...</option>
                    </select>
                </div>
                <hr class="my-5 border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800">填寫資料</h2>
                    <button onclick="clearForm()" class="text-sm text-gray-500 hover:text-red-500 transition-colors underline">清空內容</button>
                </div>
                <form id="dynamicForm" class="space-y-4">
                    <div class="text-center text-gray-400 py-8">等待模版載入...</div>
                </form>
            </div>
        </div>

        <div class="lg:col-span-7 flex flex-col gap-4">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex-grow flex flex-col">
                <div class="flex justify-between items-end mb-4">
                    <h2 class="text-lg font-bold text-gray-800">實時預覽</h2>
                    <div class="flex gap-2">
                        <button onclick="copySubject()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-medium transition border border-gray-300">複製主旨</button>
                        <button onclick="copyBody()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-medium transition border border-gray-300">複製內文</button>
                        <button onclick="copyAll()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-sm font-medium transition shadow-sm">全部複製</button>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Subject (主旨)</label>
                    <div id="previewSubject" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm text-gray-900 font-medium whitespace-pre-wrap break-words min-h-[46px]"></div>
                </div>
                <div class="flex-grow flex flex-col">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Body (內文)</label>
                    <div id="previewBody" class="w-full flex-grow bg-white border border-gray-200 rounded-lg p-4 text-sm text-gray-800 whitespace-pre-wrap font-sans leading-relaxed shadow-inner overflow-y-auto max-h-[600px]"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal 區塊 -->
    <div id="templateModal" class="fixed inset-0 bg-black/60 z-50 hidden flex-col justify-center items-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                <h3 class="text-xl font-bold text-gray-800">管理郵件模版</h3>
                <button onclick="closeTemplateManager()" class="text-gray-400 hover:text-gray-600 transition-colors">關閉</button>
            </div>
            <div class="flex flex-col md:flex-row flex-grow overflow-hidden">
                <div class="w-full md:w-1/3 border-r border-gray-200 bg-gray-50 flex flex-col">
                    <div class="p-4 border-b border-gray-200">
                        <button onclick="createNewTemplate()" class="w-full bg-white border-2 border-dashed border-blue-400 text-blue-600 hover:bg-blue-50 font-medium py-2 rounded-lg transition-colors">新增模版</button>
                    </div>
                    <ul id="templateList" class="flex-grow overflow-y-auto p-2 space-y-1"></ul>
                    <div class="p-3 border-t border-gray-200 bg-gray-100 flex gap-2">
                        <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importTemplates(event)">
                        <button onclick="document.getElementById('importFileInput').click()" class="flex-1 bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium py-1.5 rounded-lg text-sm">匯入</button>
                        <button onclick="exportTemplates()" class="flex-1 bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium py-1.5 rounded-lg text-sm">匯出</button>
                    </div>
                </div>
                <div class="w-full md:w-2/3 p-6 overflow-y-auto flex flex-col gap-4 bg-white" id="templateEditorSection">
                    <div class="hidden" id="editorEmptyState">
                        <div class="h-full flex flex-col items-center justify-center text-gray-400 py-12"><p>請選擇左側模版進行編輯</p></div>
                    </div>
                    <div id="editorActiveState" class="flex flex-col gap-4 hidden">
                        <input type="hidden" id="editTemplateId">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">模版名稱</label>
                            <input type="text" id="editTemplateName" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-blue-500 focus:border-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">郵件主旨 (Subject)</label>
                            <input type="text" id="editTemplateSubject" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-blue-500 focus:border-blue-500 outline-none font-mono text-sm">
                        </div>
                        <div class="flex-grow flex flex-col">
                            <label class="block text-sm font-semibold text-gray-700 mb-1">郵件內文 (Body) <span class="text-xs text-gray-500">支援 HTML 表格</span></label>
                            <textarea id="editTemplateBody" rows="16" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-blue-500 focus:border-blue-500 outline-none font-mono text-sm whitespace-pre"></textarea>
                        </div>
                        <div class="flex justify-between items-center pt-2">
                            <button id="deleteTemplateBtn" onclick="deleteCurrentTemplate()" class="text-red-500 hover:bg-red-50 px-3 py-2 rounded-lg text-sm font-medium">刪除此模版</button>
                            <div class="flex gap-2">
                                <button onclick="closeTemplateManager()" class="px-4 py-2 bg-gray-100 rounded-lg text-sm font-medium">取消</button>
                                <button onclick="saveTemplate()" class="px-6 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium">儲存模版</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="workspaceModal" class="fixed inset-0 bg-black/60 z-[70] hidden flex-col justify-center items-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                <h3 class="text-lg font-bold text-gray-800">設定群組共用</h3>
                <button onclick="closeWorkspaceModal()" class="text-gray-400 hover:text-gray-600">關閉</button>
            </div>
            <div class="p-6">
                <p class="text-sm text-gray-600 mb-4">輸入群組代碼，即可共用模版！</p>
                <div class="mb-5">
                    <input type="text" id="workspaceInput" placeholder="留白則使用個人專屬空間" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-purple-500 uppercase font-mono">
                </div>
                <div class="flex justify-end gap-3">
                    <button onclick="closeWorkspaceModal()" class="px-4 py-2 bg-gray-100 rounded-lg text-sm font-medium">取消</button>
                    <button onclick="saveWorkspace()" class="px-6 py-2 bg-purple-600 text-white rounded-lg text-sm font-medium">儲存並切換</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 ease-in-out bg-gray-800 text-white px-5 py-3 rounded-lg shadow-lg flex items-center gap-3 z-[100] pointer-events-none">
        <span id="toastMessage" class="font-medium text-sm"></span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const defaultTemplates = [
            {
                id: 'default-1',
                name: '預設 PRE-ALERT',
                subject: "RE: PRE-ALERT MV# {{船名及航次}}; MBL# {{MBL號碼}}",
                body: "Dear All,\nQuantity: {{櫃量及櫃型}}\nMBL# {{MBL號碼}}\nMV# {{船名及航次}}\nATD {{起運港}} : {{出發日期}}.\nETA {{目的港}} : {{抵達日期}}"
            },
            {
                id: 'default-3',
                name: '海運對代理報價表 (含表格)',
                subject: "SEA FREIGHT RATE TO {{目的港}}",
                body: `<div style="font-family: Arial, sans-serif; font-size: 14px; color: #0000CC;">
    <p style="font-weight: bold; font-size: 16px;">Here is our SEA rate to {{目的港}} for your reference</p>
    <table style="border-collapse: collapse; width: 100%; text-align: center; border: 2px solid black; font-weight: bold; color: #0000CC;">
        <tr style="background-color: #99CCFF; border: 1px solid black;">
            <th style="border: 1px solid black; padding: 6px;">CARRIER</th>
            <th style="border: 1px solid black; padding: 6px;">POD</th>
            <th style="border: 1px solid black; padding: 6px;">20'</th>
            <th style="border: 1px solid black; padding: 6px;">40'HQ</th>
            <th style="border: 1px solid black; padding: 6px;">effective to</th>
        </tr>
        <tr style="border: 1px solid black; background-color: #FFFFFF;">
            <td style="border: 1px solid black; padding: 6px;">{{船公司_1}}</td>
            <td style="border: 1px solid black; padding: 6px;">{{目的港}}</td>
            <td style="border: 1px solid black; padding: 6px;">{{櫃價20_1}}</td>
            <td style="border: 1px solid black; padding: 6px;">{{櫃價40HQ_1}}</td>
            <td style="border: 1px solid black; padding: 6px; text-align: left;">CUT OFF: {{有效結關日_1}}</td>
        </tr>
    </table>
</div>`
            }
        ];

        let state = { templates: [], currentTemplateId: null, formData: {}, workspaceId: localStorage.getItem('preAlertWorkspace') || '' };
        const regexVars = /{{(.*?)}}/g;
        let db, auth, appId, currentUser, isCloudMode = false, unsubscribeSnapshot = null;

        window.handleTemplateChange = handleTemplateChange;
        window.clearForm = clearForm;
        window.copySubject = copySubject;
        window.copyBody = copyBody;
        window.copyAll = copyAll;
        window.openTemplateManager = openTemplateManager;
        window.closeTemplateManager = closeTemplateManager;
        window.createNewTemplate = createNewTemplate;
        window.loadTemplateIntoEditor = loadTemplateIntoEditor;
        window.saveTemplate = saveTemplate;
        window.deleteCurrentTemplate = deleteCurrentTemplate;
        window.openWorkspaceModal = openWorkspaceModal;
        window.closeWorkspaceModal = closeWorkspaceModal;
        window.saveWorkspace = saveWorkspace;

        function getCollectionRef() {
            return state.workspaceId ? collection(db, 'artifacts', appId, 'public', 'data', 'workspace_' + state.workspaceId) : collection(db, 'artifacts', appId, 'users', currentUser.uid, 'templates');
        }

        async function init() {
            try {
                const firebaseConfig = {
                    apiKey: "AIzaSyAnUC8VcV4WMgnIxNcWE2R7u17fl2yTA7w",
                    authDomain: "prealert-system.firebaseapp.com",
                    projectId: "prealert-system",
                    storageBucket: "prealert-system.firebasestorage.app",
                    messagingSenderId: "713222308706",
                    appId: "1:713222308706:web:8034e2ec75e1715818e23b"
                };
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app); db = getFirestore(app); appId = 'company-pre-alert'; isCloudMode = true;
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => { currentUser = user; if (user) { updateWorkspaceUI(); listenToTemplates(); } });
            } catch (e) { fallbackToLocal(); }
        }

        function listenToTemplates() {
            if (!currentUser || !isCloudMode) return;
            if (unsubscribeSnapshot) unsubscribeSnapshot();
            unsubscribeSnapshot = onSnapshot(getCollectionRef(), (snapshot) => {
                const loaded = []; snapshot.forEach(doc => loaded.push(doc.data()));
                if (loaded.length === 0) seedCloudWithDefaults();
                else { state.templates = loaded.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); updateUI(); }
            });
        }

        async function seedCloudWithDefaults() {
            if (!currentUser || !isCloudMode) return;
            const ts = Date.now();
            for (let i = 0; i < defaultTemplates.length; i++) {
                const t = defaultTemplates[i]; t.createdAt = ts + i; await setDoc(doc(getCollectionRef(), t.id), t);
            }
        }

        function fallbackToLocal() {
            isCloudMode = false;
            const saved = localStorage.getItem('preAlertTemplates');
            if (saved) { try { state.templates = JSON.parse(saved); if(state.templates.length===0) throw new Error(); } catch (e) { state.templates = [...defaultTemplates]; } } 
            else { state.templates = [...defaultTemplates]; }
            updateUI();
        }

        function updateUI() {
            const select = document.getElementById('templateSelect'); select.innerHTML = '';
            state.templates.forEach(t => { const opt = document.createElement('option'); opt.value = t.id; opt.textContent = t.name; select.appendChild(opt); });
            if (state.templates.length > 0) {
                if (!state.currentTemplateId || !state.templates.find(t => t.id === state.currentTemplateId)) state.currentTemplateId = state.templates[0].id;
                select.value = state.currentTemplateId; handleTemplateChange();
                if (!document.getElementById('templateModal').classList.contains('hidden')) renderTemplateList();
            }
        }

        function handleTemplateChange() {
            state.currentTemplateId = document.getElementById('templateSelect').value; state.formData = {}; buildForm(); updatePreview();
        }

        function clearForm() { state.formData = {}; document.querySelectorAll('#dynamicForm input').forEach(i => i.value = ''); updatePreview(); showToast('已清空'); }

        function buildForm() {
            const t = state.templates.find(t => t.id === state.currentTemplateId);
            const form = document.getElementById('dynamicForm'); form.innerHTML = '';
            if (!t) return;
            const vars = new Set();
            let m; while ((m = regexVars.exec(t.subject + "\n" + t.body)) !== null) vars.add(m[1].trim());
            const varArr = Array.from(vars);
            if (varArr.length === 0) { form.innerHTML = '<div class="py-4">沒有變數</div>'; return; }
            const grid = document.createElement('div'); grid.className = 'grid grid-cols-1 md:grid-cols-2 gap-4';
            varArr.forEach(v => {
                const w = document.createElement('div');
                const l = document.createElement('label'); l.className = 'block text-sm font-semibold mb-1'; l.textContent = v;
                const i = document.createElement('input'); i.className = 'w-full border p-2 rounded'; i.placeholder = v;
                i.value = state.formData[v] || '';
                i.addEventListener('input', e => { state.formData[v] = e.target.value; updatePreview(); });
                w.appendChild(l); w.appendChild(i); grid.appendChild(w);
            });
            form.appendChild(grid);
        }

        function escapeHtml(s) { return (s||"").toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

        function generatePreviewHtml(text) {
            if(!text) return '';
            let h = text.replace(regexVars, (m, p1) => {
                const v = state.formData[p1.trim()];
                return v ? `<span class="bg-yellow-300 px-1 rounded">${escapeHtml(v)}</span>` : `<span class="bg-gray-200 px-1 rounded">${escapeHtml(m)}</span>`;
            });
            if (!/<[a-z][\s\S]*>/i.test(h)) h = h.replace(/\n/g, '<br>');
            return h;
        }

        function updatePreview() {
            const t = state.templates.find(t => t.id === state.currentTemplateId);
            if (t) { document.getElementById('previewSubject').innerHTML = generatePreviewHtml(t.subject); document.getElementById('previewBody').innerHTML = generatePreviewHtml(t.body); }
        }

        function generateCleanHtml(text) {
            if(!text) return '';
            let h = text.replace(regexVars, (m, p1) => { const v = state.formData[p1.trim()]; return v ? escapeHtml(v) : ''; });
            if (!/<[a-z][\s\S]*>/i.test(h)) h = h.replace(/\n/g, '<br>'); return h;
        }
        function generatePlainText(text) {
            if(!text) return '';
            return text.replace(regexVars, (m, p1) => { const v = state.formData[p1.trim()]; return v ? v : ''; });
        }

        function copyRichText(html, msg) {
            const temp = document.createElement("div"); temp.innerHTML = html; temp.style.position = "absolute"; temp.style.left = "-9999px";
            document.body.appendChild(temp);
            const sel = window.getSelection(); const range = document.createRange(); range.selectNodeContents(temp);
            sel.removeAllRanges(); sel.addRange(range);
            try { document.execCommand('copy'); showToast(msg); } catch(e) {}
            sel.removeAllRanges(); document.body.removeChild(temp);
        }
        function fallbackCopy(txt, msg) {
            const t = document.createElement("textarea"); t.value = txt; t.style.position = "fixed"; document.body.appendChild(t); t.select();
            try { document.execCommand('copy'); showToast(msg); } catch(e) {} document.body.removeChild(t);
        }

        function copySubject() { const t = state.templates.find(t => t.id === state.currentTemplateId); if(t) fallbackCopy(generatePlainText(t.subject), '主旨已複製'); }
        function copyBody() { const t = state.templates.find(t => t.id === state.currentTemplateId); if(t) copyRichText(generateCleanHtml(t.body), '內容已複製'); }
        function copyAll() { const t = state.templates.find(t => t.id === state.currentTemplateId); if(t) copyRichText(`<p><b>Subject: ${generatePlainText(t.subject)}</b></p><br>${generateCleanHtml(t.body)}`, '全部已複製'); }

        let ttm; function showToast(msg) { const t = document.getElementById('toast'); document.getElementById('toastMessage').textContent = msg; t.classList.remove('translate-y-20', 'opacity-0'); clearTimeout(ttm); ttm = setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 2000); }

        function openTemplateManager() { document.getElementById('templateModal').classList.remove('hidden'); document.getElementById('templateModal').classList.add('flex'); renderTemplateList(); }
        function closeTemplateManager() { document.getElementById('templateModal').classList.add('hidden'); document.getElementById('templateModal').classList.remove('flex'); }
        function renderTemplateList() {
            const l = document.getElementById('templateList'); l.innerHTML = '';
            state.templates.forEach(t => {
                const li = document.createElement('li'); li.className = `p-3 border-b cursor-pointer hover:bg-gray-100 ${document.getElementById('editTemplateId').value === t.id ? 'bg-blue-50' : ''}`;
                li.onclick = () => loadTemplateIntoEditor(t.id); li.innerHTML = `<div class="font-bold">${escapeHtml(t.name)}</div>`; l.appendChild(li);
            });
        }
        function createNewTemplate() { document.getElementById('editTemplateId').value = 'new'; document.getElementById('editTemplateName').value = '新模版'; document.getElementById('editTemplateSubject').value = ''; document.getElementById('editTemplateBody').value = ''; document.getElementById('editorEmptyState').classList.add('hidden'); document.getElementById('editorActiveState').classList.remove('hidden'); }
        function loadTemplateIntoEditor(id) { const t = state.templates.find(t => t.id === id); if(!t)return; document.getElementById('editTemplateId').value = t.id; document.getElementById('editTemplateName').value = t.name; document.getElementById('editTemplateSubject').value = t.subject; document.getElementById('editTemplateBody').value = t.body; document.getElementById('editorEmptyState').classList.add('hidden'); document.getElementById('editorActiveState').classList.remove('hidden'); renderTemplateList(); }
        async function saveTemplate() {
            const id = document.getElementById('editTemplateId').value, name = document.getElementById('editTemplateName').value, subject = document.getElementById('editTemplateSubject').value, body = document.getElementById('editTemplateBody').value;
            let t = { id: id === 'new' ? 'tpl_'+Math.random().toString(36).substr(2,9) : id, name, subject, body, createdAt: Date.now() };
            if (isCloudMode && currentUser) { await setDoc(doc(getCollectionRef(), t.id), t); showToast('已儲存'); }
        }
        function deleteCurrentTemplate() {
            const id = document.getElementById('editTemplateId').value; if(id==='new')return;
            if(confirm('確定刪除？') && isCloudMode && currentUser) { deleteDoc(doc(getCollectionRef(), id)); document.getElementById('editorActiveState').classList.add('hidden'); document.getElementById('editorEmptyState').classList.remove('hidden'); showToast('已刪除'); }
        }

        function updateWorkspaceUI() { document.getElementById('workspaceText').textContent = state.workspaceId ? `群組: ${state.workspaceId}` : '個人專屬'; }
        function openWorkspaceModal() { document.getElementById('workspaceInput').value = state.workspaceId; document.getElementById('workspaceModal').classList.remove('hidden'); document.getElementById('workspaceModal').classList.add('flex'); }
        function closeWorkspaceModal() { document.getElementById('workspaceModal').classList.add('hidden'); document.getElementById('workspaceModal').classList.remove('flex'); }
        function saveWorkspace() {
            state.workspaceId = document.getElementById('workspaceInput').value.trim().toUpperCase().replace(/[^A-Z0-9-]/g, ''); localStorage.setItem('preAlertWorkspace', state.workspaceId); updateWorkspaceUI(); closeWorkspaceModal();
            if (isCloudMode) { listenToTemplates(); showToast('已切換'); }
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
